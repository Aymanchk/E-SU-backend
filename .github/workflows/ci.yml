name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.6.4
      - run: ruff check backend
      - run: ruff format --check backend

  test:
    name: Тесты
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: esu_test
          POSTGRES_USER: esu
          POSTGRES_PASSWORD: esu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-secret-key-not-for-production-must-be-long-enough
      DEBUG: "True"
      DATABASE_URL: postgres://esu:esu@localhost:5432/esu_test
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Проверка миграций
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Проверка OpenAPI схемы
        working-directory: backend
        run: python manage.py spectacular --file /tmp/schema.yml --fail-on-warn

      - name: Тесты
        working-directory: backend
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=70
